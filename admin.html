<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechshiftCrea Admin</title><style>body{margin:0;font-family:Inter,system-ui;background:#101114;color:#f4f1ea}main{width:min(1100px,calc(100% - 32px));margin:40px auto}input,button,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #555;background:#191a1e;color:#fff}button{cursor:pointer;background:#d8ff52;color:#101114;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#191a1e;border:1px solid #333;border-radius:18px;padding:18px;margin:12px 0}.muted{color:#aaa}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:6px 9px;border-radius:999px;background:#2a2b30;font-size:12px}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>TECHSHIFTCREA <span class="muted">Admin</span></h1><section id="login" class="card"><p>Private dashboard. Only your admin password can access submissions.</p><div class="row"><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">Sign in</button></div><p id="msg" class="muted"></p></section><section id="app" class="hidden"><div class="row"><div class="pill">Creators: <b id="creators">0</b></div><div class="pill">Brands: <b id="brands">0</b></div><button onclick="load()">Refresh</button></div><div class="grid"><div><h2>Best matches</h2><div id="matches"></div></div><div><h2>Latest submissions</h2><div id="list"></div></div></div></section></main><script>let rows=[];async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});if(!r.ok){document.getElementById('msg').textContent='Wrong password.';return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');load()}async function load(){const r=await fetch('/api/admin/data');if(r.status===401){location.reload();return}const j=await r.json();rows=j.results||[];const c=rows.filter(x=>x.type==='creator'),b=rows.filter(x=>x.type==='brand');document.getElementById('creators').textContent=c.length;document.getElementById('brands').textContent=b.length;document.getElementById('list').innerHTML=rows.slice(0,30).map(card).join('');document.getElementById('matches').innerHTML=makeMatches(b,c).slice(0,20).map(m=>`<div class="card"><b>${esc(m.brand)}</b> → <b>${esc(m.creator)}</b><div class="muted">Match score: ${m.score}%</div><div class="muted">${esc(m.reason)}</div></div>`).join('')||'<p class="muted">Submit brands and creators to see matches.</p>'}function card(x){const d=x.data||{};return `<div class="card"><div class="row"><span class="pill">${x.type}</span><span class="muted">${esc(x.created_at)}</span></div><h3>${esc(d.brand||d.name||'Unnamed')}</h3><div class="muted">${Object.entries(d).filter(([k,v])=>v).slice(0,8).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join(' · ')}</div></div>`}function makeMatches(bs,cs){return bs.flatMap(b=>cs.map(c=>{let s=40,why=[];const B=b.data,C=c.data;if(B.niche&&C.niche&&B.niche===C.niche){s+=20;why.push('niche')}if(B.platform&&C.content&&((B.platform==='YouTube'&&/YouTube|Long-form|Reviews|Gaming/.test(C.content))||(B.platform==='Instagram'&&/Shorts|Reels|UGC/.test(C.content))||B.platform==='Both')){s+=15;why.push('platform/content')}if(B.subs&&C.yt&&B.subs.includes('1M+')&&/M/.test(C.yt))s+=10;if(B.content&&C.content&&B.content===C.content){s+=10;why.push('format')}if(B.length&&C.length&&B.length===C.length){s+=5;why.push('length')}return {brand:B.brand||'Brand',creator:C.name||'Creator',score:Math.min(99,s),reason:why.length?'Matches on '+why.join(', '):'Potential match — review profile'}})).sort((a,b)=>b.score-a.score)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
